baseURL = 'https://go-statistics.github.io/'
locale  = 'en-us'
title   = 'go-statistics'
# No theme -- the layout is the go-* family template (go-fileshare.github.io's,
# via logos/landing-kit, as go-numerics and go-dataframe use it): one
# self-contained layouts/index.html, partials/styles.html (the shared sheet,
# byte-identical) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-statistics: probability distributions, descriptive statistics and statistical tests in pure Go (CGO=0) on go-ndarray, measured in ULPs against mpmath, with random draws that reproduce SciPy's for the same seed."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "stats"
  kind  = "library"
  href  = "https://github.com/go-statistics/stats"
  blurb = "24 continuous, 8 discrete and 3 multivariate distributions with pdf, cdf, sf, ppf, isf and their logarithms, moments, entropy, draws and fits; descriptive statistics with NumPy's 13 quantile methods; hypothesis tests, correlations and linear regression; the Gaussian KDE and the bootstrap. Every distribution function measured in ULPs against mpmath."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-statistics.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra), built from the library's own README and <code>docs/</code>: design, accuracy, the per-region accuracy table, draws and speed. <a href=\"https://github.com/go-statistics/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-statistics/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants; the mark is a normal density, computed by a Go program."

# The cards of #exact and their count come from this list. Each statement is
# from go-statistics/stats' README or docs/ (accuracy.md, rvs-table.md).
[[params.checks]]
  name = "Distributions in ULPs"
  what = "256 fixtures, 1479 regions, about 212 000 points, each against mpmath at 192 and 320 bits: the maximum error is at or below SciPy's in 1473 regions. The six exceptions are the beta sf and ppf, all under 4.5 ulp."
[[params.checks]]
  name = "Tails and large shapes"
  what = "Every normal function at or below 0.55 ulp. Gamma, chi, chi-squared, inverse gamma, beta and t densities at or below 1.3 ulp where SciPy loses up to 10⁷ ulp at large shapes; binomial, Poisson and negative binomial masses at or below 0.5 ulp."
[[params.checks]]
  name = "Draws, to the bit"
  what = "For the same seed, the draws of 17 distributions (normal, t, exponential, uniform, all eight discrete ones…), Dirichlet, multinomial and the bootstrap resamples are bit-identical to SciPy's. Twelve others differ in a few draws per thousand by 1–4 ulp; Cauchy, inverse gamma and von Mises differ more, and the table says how much."
[[params.checks]]
  name = "NumPy's statistics, bit for bit"
  what = "Means, variances, standard deviations, medians, all 13 quantile methods (also weighted), histograms and bin edges: bit-identical to NumPy 2.5.4 over tens of thousands of values."
[[params.checks]]
  name = "Tests against exact references"
  what = "About 4100 SciPy cases and 3100 exact references: statistics and p-values agree with SciPy to 1.4e-13 relative, except where the exact reference shows SciPy is off — Fisher's exact test, exact Kolmogorov–Smirnov and Mann–Whitney, Anderson–Darling."
[[params.checks]]
  name = "Negative controls"
  what = "One thing broken at a time — Loader's Stirling coefficient 1/1260 moved to 1/1261, Kendall's variance 2n+5 to 2n+6, a 1/24 in expm1 to 1/23 — and each break makes the suite fail. The budgets hold on amd64, arm64, 386, arm, riscv64, loong64, ppc64le and s390x."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.73:1, bright on the dark background 10.52:1.
  base = "#9e520f"
  deep = "#603209"
  bright = "#f2b36b"
  shadow = "rgba(158,82,15,.7)"
  glow = "rgba(158,82,15,.6)"
  wash = "rgba(158,82,15,.10)"
  washDeep = "rgba(96,50,9,.06)"
  chipBg = "#fdf6ed"
  chipBorder = "#fbe8d3"
  chipFg = "#603209"
  chipBgDark = "rgba(242,179,107,.14)"
  chipBorderDark = "rgba(242,179,107,.32)"
  chipFgDark = "#f8d5ae"
